version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfilebackend
    container_name: backend
    ports:
      - "5001:5001"
    environment:
      - Url_Db=mongodb://baccarhanine:pvKCqF5yZEsIQEZj@host.docker.internal:27017
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfilefrontend
    env_file:
      - .env.docker
    container_name: frontend
    ports:
      - "5371:80"
    depends_on:
      - backend
    restart: unless-stopped

# volumes seulement si backend ou frontend a besoin
volumes:
  mongo-data:
